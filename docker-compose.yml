services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: proboxai
      POSTGRES_USER: proboxai
      POSTGRES_PASSWORD: proboxai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: proboxai
      MINIO_ROOT_PASSWORD: change-this-before-production
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
volumes:
  postgres-data:
  minio-data:
